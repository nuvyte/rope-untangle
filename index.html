<h1>Rope Untangle</h1>
<p>A calm logic puzzle for Android. Ropes are tied to pegs on the board edge — tap a rope to reel it back, but only if no other rope lies on top of it. Work your way through hundreds of boards, from gentle warm-ups to tricky knots.</p>
